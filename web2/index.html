<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <h1>Descubra dados sobre seu nome</h1>
  <input type="text" id="nome" placeholder="Digite seu nome" />
  <button onclick="buscarDados()">Buscar</button>

  <div id="resultado" style="margin-top: 20px;"></div>

  <script>
    async function buscarDados() {
      const nome = document.getElementById('nome').value.trim();
      if (!nome) {
        alert("Por favor, digite um nome!");
        return;
      }

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.innerHTML = "Buscando dados...";

      try {
        const [idade, genero, pais] = await Promise.all([
          fetch(`https://api.agify.io?name=${nome}`).then(res => res.json()),
          fetch(`https://api.genderize.io?name=${nome}`).then(res => res.json()),
          fetch(`https://api.nationalize.io?name=${nome}`).then(res => res.json())
        ]);

        const paisMaisProvavel = pais.country[0] 
          ? `${pais.country[0].country_id} (${Math.round(pais.country[0].probability * 100)}%)`
          : 'Não identificado';

        resultadoDiv.innerHTML = `
          <p><strong>Nome:</strong> ${nome}</p>
          <p><strong>Idade estimada:</strong> ${idade.age ?? 'Não disponível'}</p>
          <p><strong>Gênero estimado:</strong> ${genero.gender ?? 'Não disponível'}</p>
          <p><strong>País mais provável:</strong> ${paisMaisProvavel}</p>
        `;
      } catch (erro) {
        resultadoDiv.innerHTML = "Erro ao buscar os dados. Tente novamente.";
        console.error(erro);
      }
    }
  </script>
</body>
</html>
